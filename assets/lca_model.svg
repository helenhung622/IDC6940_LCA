<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img"><rect width="900" height="390" fill="#fbfdff"/><g font-family="Arial, sans-serif" fill="#243447"><rect x="300" y="20" width="300" height="70" rx="35" fill="#dbeaf1" stroke="#24556e" stroke-width="2"/><text x="450" y="50" text-anchor="middle" font-size="20">Latent class C</text><text x="450" y="75" text-anchor="middle" font-size="15">Unobserved health profile</text><path d="M450 90 L69 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="10" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="69" y="209" text-anchor="middle" font-size="14">HPV vaccine</text><text x="69" y="232" text-anchor="middle" font-size="14">initiation</text><path d="M450 90 L196 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="137" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="196" y="209" text-anchor="middle" font-size="14">Depressive</text><text x="196" y="232" text-anchor="middle" font-size="14">symptoms</text><path d="M450 90 L323 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="264" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="323" y="209" text-anchor="middle" font-size="14">Elevated</text><text x="323" y="232" text-anchor="middle" font-size="14">waist</text><path d="M450 90 L450 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="391" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="450" y="209" text-anchor="middle" font-size="14">Elevated</text><text x="450" y="232" text-anchor="middle" font-size="14">blood pressure</text><path d="M450 90 L577 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="518" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="577" y="209" text-anchor="middle" font-size="14">Elevated</text><text x="577" y="232" text-anchor="middle" font-size="14">glucose</text><path d="M450 90 L704 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="645" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="704" y="209" text-anchor="middle" font-size="14">Low HDL</text><text x="704" y="232" text-anchor="middle" font-size="14">cholesterol</text><path d="M450 90 L831 180" stroke="#739aad" fill="none" stroke-width="1.5"/><rect x="772" y="180" width="118" height="72" rx="6" fill="#edf4f7" stroke="#739aad"/><text x="831" y="209" text-anchor="middle" font-size="14">Elevated</text><text x="831" y="232" text-anchor="middle" font-size="14">triglycerides</text><text x="450" y="300" text-anchor="middle" font-size="17">Seven observed binary indicators</text><text x="450" y="335" text-anchor="middle" font-size="15">Local independence: indicator responses are independent conditional on class.</text><text x="450" y="363" text-anchor="middle" font-size="15">Lines represent the measurement model, not causal effects.</text></g></svg>